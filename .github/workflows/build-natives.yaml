name: Build Native Libraries

on:
  workflow_call:

# Native binaries are a pure function of the C sources. Each platform job caches
# its output tree keyed on a hash of every src/**/native/** file (plus this
# workflow). On a cache hit the compile steps are skipped and the job only
# verifies + re-uploads the artifact for downstream consumers.
#
# Currently only Linux is built (WebKit2GTK backend). Windows/macOS stay no-op
# until their native backends land — add matrix jobs then.
#
# Bump the `natives-v1` prefix to force a full rebuild.

jobs:
  linux:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Restore native output cache
        id: natives-cache
        uses: actions/cache@v4
        with:
          path: 'webview-compose/src/jvmMain/resources/nucleus/native/linux-*'
          key: natives-v1-linux-${{ matrix.arch }}-${{ hashFiles('webview-compose/src/jvmMain/native/**', '.github/workflows/build-natives.yaml') }}

      - name: Setup JDK 21
        if: steps.natives-cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install build dependencies
        if: steps.natives-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libcairo2-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev || \
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libcairo2-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.0-dev

      - name: Build compose WebView Linux native library
        if: steps.natives-cache.outputs.cache-hit != 'true'
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: bash webview-compose/src/jvmMain/native/linux/build.sh

      - name: Verify Linux natives
        run: |
          f="webview-compose/src/jvmMain/resources/nucleus/native/linux-${{ matrix.arch }}/libcompose_webview_linux.so"
          if [ -f "$f" ]; then
            echo "OK: $f ($(wc -c < "$f") bytes)"
            file "$f" || true
          else
            echo "MISSING: $f" >&2
            find webview-compose/src/jvmMain/resources/nucleus/native -type f 2>/dev/null || true
            exit 1
          fi

      - name: Upload Linux natives
        uses: actions/upload-artifact@v4
        with:
          name: natives-linux-${{ matrix.arch }}
          path: 'webview-compose/src/jvmMain/resources/nucleus/native/linux-*/'
          retention-days: 1
