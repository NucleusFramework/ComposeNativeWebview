# WebKitLinuxBridge loads libcompose_webview_linux via NativeLibraryLoader in
# a static field initializer — must stay at run time (native-image would
# otherwise try to open the .so during build).
Args = --initialize-at-run-time=dev.nucleusframework.webview.web.linux.WebKitLinuxBridge,\
dev.nucleusframework.webview.web.linux.LinuxWebKitNativeWebView
