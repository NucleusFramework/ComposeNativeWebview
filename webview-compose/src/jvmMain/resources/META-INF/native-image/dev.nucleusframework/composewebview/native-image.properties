# Native bridges load their .so/.dll via NativeLibraryLoader in a static
# field initializer — must stay at run time (native-image would otherwise
# try to open the library during build).
Args = --initialize-at-run-time=dev.nucleusframework.webview.web.linux.WebKitLinuxBridge,\
dev.nucleusframework.webview.web.linux.LinuxWebKitNativeWebView,\
dev.nucleusframework.webview.web.windows.WebView2WindowsBridge,\
dev.nucleusframework.webview.web.windows.WindowsWebView2NativeWebView
